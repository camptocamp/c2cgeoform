name: Continuous integration

on:
  push:

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: sudo apt-get install --yes gettext libgeos-dev

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install c2cciutils
        run: python3 -m pip install --requirement=ci/requirements.txt
      - name: Print the environment
        run: c2cciutils-env
        env:
          GITHUB_EVENT: ${{ toJson(github) }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --color=always
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build
        run: make build

      - name: Lint
        run: make check

      - name: Tests
        run: make test

      - name: Documentation
        run: make docs

      - name: Docker compose logs
        run: |
          c2cciutils-docker-logs
          docker compose down -v --remove-orphans
        if: always()

      # Mark as success
      - id: success
        run: echo "success=true" >> $GITHUB_OUTPUT

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: main
    if: always()

    permissions:
      contents: read
      id-token: write

    steps:
      - run: '[[ "${{ needs.main.outputs.success }}" == "true" ]]'

      # The full history is required to compute the version from the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Provides the pip, python3 and poetry that tag-publish calls to build the wheel.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          cache-python: true
          python-version: '3.13'

      # The files that are not committed but should be in the package: the compiled
      # translations and the JavaScript bundle.
      - name: Install packages
        run: sudo apt-get install --yes gettext
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build the package files
        run: make compile-catalog c2cgeoform/static/dist/index.js

      - name: Publish
        run: uv run --locked --isolated --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()

permissions:
  contents: read
